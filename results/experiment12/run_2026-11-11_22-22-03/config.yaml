experiment: experiment12
description: Analyze matched 70/30 per-seed AUC results for TabPFN versus paper-config
  GB and WGAN augmentation effects; no model retraining
seeds:
  start: 42
  end: 100
alpha: 0.05
test:
  metric: roc_auc
  method: Nadeau-Bengio corrected resampled paired t-test
  sidedness: two-sided
  multiple_comparison_correction: Holm
  correction_family: all five planned comparisons
inputs:
  experiment5_metrics: results/experiment5/run_2026-11-03_18-27-50/metrics/per_seed_metrics.csv
  experiment7_metrics: results/experiment7/run_2026-11-09_22-54-43/metrics/per_seed_metrics.csv
  experiment10_metrics: results/experiment10/run_2026-11-10_02-14-37/metrics/per_seed_metrics.csv
  experiment11_metrics: results/experiment11/run_2026-11-10_19-25-01/metrics/per_seed_metrics.csv
  split_manifests:
    experiment5: results/experiment5/run_2026-11-03_18-27-50/splits/patient_split_manifest.csv
    experiment7: results/experiment7/run_2026-11-09_22-54-43/splits/patient_split_manifest.csv
    experiment10: results/experiment10/run_2026-11-10_02-14-37/splits/patient_split_manifest.csv
    experiment11: results/experiment11/run_2026-11-10_19-25-01/splits/patient_split_manifest.csv
comparisons:
- TabPFN real-only minus paper-config GB real-only
- GB + WGAN minus GB real-only
- VAE + GB + WGAN minus VAE + GB (beta=0.0005)
- SS-VAE + GB + WGAN minus SS-VAE + GB (beta=0.0005)
- TabPFN real + WGAN minus TabPFN real-only
output:
  save_per_seed_paired_differences: true
  save_corrected_test_results: true
  save_holm_adjusted_p_values: true
  save_markdown_interpretation: true
