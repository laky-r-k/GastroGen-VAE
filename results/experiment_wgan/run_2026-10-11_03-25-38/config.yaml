experiment: experiment_wgan
description: 'Objective 3: Conditional WGAN-GP Tabular Augmentation Evaluation'
seed: 42
dataset:
  train_raw_path: dataset/gastric_cancer_train.csv
  test_raw_path: dataset/gastric_cancer_test.csv
  label_column: label
preprocessing:
  scaler_type: standard
  log_columns:
  - cea
  - ca199
  - ca125
  - ca724
  - lpa
  - alt
  - tb
  - tg
gan:
  latent_dim: 16
  hidden_dim: 128
  use_layer_norm: true
  use_batch_norm: false
  learning_rate_g: 0.0001
  learning_rate_d: 0.0001
  betas:
  - 0.5
  - 0.9
  lambda_gp: 10.0
  n_critic: 5
  generator_steps: 5000
  batch_size: 64
  checkpoint_interval: 500
evaluation:
  cv_splits: 5
  cv_repeats: 5
  synthetic_ratios:
  - 0.5
  - 1.0
  - 2.0
  classifier: gradient_boosting
  bootstrap_rounds: 1000
smoke_test:
  enabled: false
  generator_steps: 200
  cv_splits: 2
  cv_repeats: 1
