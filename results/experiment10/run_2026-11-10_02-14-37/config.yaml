experiment: experiment10
description: Train paper-config raw GB, VAE+GB, and SS-VAE+GB (beta 0.0005) on balanced
  real + per-split WGAN-GP data across stratified 70/30 seeds
beta: 0.0005
synthetic_output_dir: dataset/synthetic_8_features/experiment10
runtime:
  torch_num_threads: 1
dataset:
  raw_path: dataset/orginal_data/gastric_cancer_dataset_raw.csv
  label_column: label
  id_column: patient_id
split:
  test_size: 0.3
  seed_start: 42
  seed_end: 100
preprocessing:
  kmeans_clusters: 5
  selected_features:
  - gender
  - age
  - neu_lym
  - hb
  - alb
  - cea
  - ca125
  - ca199
  vae_scaler: StandardScaler fitted on each real training partition; reused for synthetic
    and test rows
wgan_gp:
  latent_dim: 16
  hidden_dim: 128
  use_layer_norm: true
  learning_rate_g: 0.0001
  learning_rate_d: 0.0001
  betas:
  - 0.5
  - 0.9
  lambda_gp: 10.0
  n_critic: 5
  generator_steps: 5000
  batch_size: 64
  checkpoint_interval: 500
  device: cpu
  verbose: false
  log1p_features:
  - neu_lym
  - cea
  - ca125
  - ca199
  synthetic_size: equal to real training rows; reverse training class counts to make
    the combined data exactly balanced
paper_gradient_boosting:
  n_estimators: 70
  learning_rate: 0.12
  max_depth: 5
  min_samples_split: 2
  min_samples_leaf: 10
  max_features: null
gradient_boosting:
  n_estimators: 200
  learning_rate: 0.1
  max_depth: 4
  min_samples_split: 4
  min_samples_leaf: 2
  max_features: sqrt
vae:
  latent_dim: 4
  hidden_dim1: 128
  hidden_dim2: 64
  dropout_rate: 0.1
  learning_rate: 0.001
  weight_decay: 1.0e-05
  epochs: 100
  batch_size: 64
  device: cpu
ss_vae:
  latent_dim: 4
  hidden_dim1: 128
  hidden_dim2: 64
  classifier_hidden: 32
  dropout_rate: 0.1
  learning_rate: 0.001
  weight_decay: 1.0e-05
  alpha: 10.0
  epochs: 100
  batch_size: 64
  device: cpu
