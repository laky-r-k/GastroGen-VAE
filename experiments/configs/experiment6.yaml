# Experiment 6: save a deployable paper-feature Gradient Boosting pipeline.

experiment: experiment6
description: "Train and serialize a paper-settings Gradient Boosting model on the eight selected predictors"

# Use the fixed seed-42 70/30 split; do not select the best-performing seed.
seed: 42

dataset:
  train_path: "dataset/split70_30/gastric_cancer_train.csv"
  test_path: "dataset/split70_30/gastric_cancer_test.csv"
  label_column: "label"
  id_column: "patient_id"

preprocessing:
  kmeans_clusters: 5

gradient_boosting:
  n_estimators: 70
  learning_rate: 0.12
  max_depth: 5
  min_samples_leaf: 10
  # Not reported by the paper; use scikit-learn defaults.
  min_samples_split: 2
  max_features: null
