# Experiment 4: Gradient Boosting with the settings reported in the reference paper.
# The data split stays the same as this project so results can be compared with
# its existing runs; this is not an exact replication of the paper's cohort.

experiment: experiment4
description: "Evaluate Gradient Boosting using the reference paper's reported hyperparameters"

dataset:
  train_path: "dataset/processed_dataset/processed_train.csv"
  test_path: "dataset/processed_dataset/processed_test.csv"
  label_column: "label"

gradient_boosting:
  n_estimators: 70
  learning_rate: 0.12
  max_depth: 5
  min_samples_split: 2
  min_samples_leaf: 10
  max_features: null
  random_state: 42
