# Experiment 1 Configuration
# Comparison of VAE + Gradient Boosting vs Baseline Gradient Boosting

experiment: experiment1
description: "Comparison of VAE-compressed latent space + Gradient Boosting vs Baseline Gradient Boosting"

dataset:
  train_path: "dataset/processed_dataset/processed_train.csv"
  test_path: "dataset/processed_dataset/processed_test.csv"
  label_column: "label"

vae:
  latent_dim: 8
  hidden_dim1: 128
  hidden_dim2: 64
  dropout_rate: 0.1
  learning_rate: 0.001
  weight_decay: 0.00001
  beta: 0.005
  epochs: 100
  batch_size: 64

gradient_boosting:
  n_estimators: 200
  learning_rate: 0.1
  max_depth: 4
  min_samples_split: 4
  min_samples_leaf: 2
  max_features: "sqrt"
  random_state: 42
