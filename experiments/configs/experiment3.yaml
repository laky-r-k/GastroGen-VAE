# Experiment 3: Semi-Supervised VAE vs. Gradient Boosting Multi-Seed Benchmark

experiment: experiment3
description: "Evaluates Semi-Supervised VAE with End-to-End Neural Classifier and SS-VAE + Gradient Boosting on Augmented Training Data"

# Multi-seed evaluation for robust statistics (Mean ± Std)
seeds:
  - 42
  - 123
  - 456
  - 789
  - 2024

dataset:
  train_real_path: "dataset/processed_dataset/processed_train.csv"
  train_synthetic_path: "dataset/synthetic_dataset/synthetic_train.csv"
  test_real_path: "dataset/processed_dataset/processed_test.csv"
  label_column: "label"

augmentation:
  # 1.0 = all 566 synthetic patients (total training pool = 1,133 patients)
  synthetic_ratio: 1.0

# Semi-Supervised VAE Hyperparameters
ss_vae:
  latent_dim: 8
  hidden_dim1: 128
  hidden_dim2: 64
  classifier_hidden: 32
  dropout_rate: 0.1
  learning_rate: 0.001
  weight_decay: 0.00001
  beta: 0.005           # KL Divergence weight
  alpha: 10.0           # Classification loss weight
  epochs: 100
  batch_size: 64

# Standard Unsupervised VAE Baseline Hyperparameters
unsupervised_vae:
  latent_dim: 8
  hidden_dim1: 128
  hidden_dim2: 64
  dropout_rate: 0.1
  learning_rate: 0.001
  weight_decay: 0.00001
  beta: 0.005
  epochs: 100
  batch_size: 64

# Gradient Boosting Hyperparameters
gradient_boosting:
  n_estimators: 200
  learning_rate: 0.1
  max_depth: 4
  min_samples_split: 4
  min_samples_leaf: 2
  max_features: "sqrt"
